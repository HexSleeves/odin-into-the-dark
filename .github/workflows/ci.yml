name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: nightly

      - name: Install lld (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install lld

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y lld libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev libasound2-dev libudev-dev libwayland-dev

      - name: Build vendor stb libs (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: make -C "$(odin root)/vendor/stb/src"

      - uses: actions/checkout@v6

      - name: Checkout karl2d
        uses: actions/checkout@v6
        with:
          repository: karl-zylinski/karl2d
          path: karl2d

      - name: Link karl2d sibling import path
        run: ln -sfn "$GITHUB_WORKSPACE/karl2d" "$GITHUB_WORKSPACE/../karl2d"

      - name: Run tests
        run: python3 scripts/run_odin_tests.py

      - name: Run flag-matrix tests
        run: |
          python3 scripts/run_odin_tests.py --root-only -define:CHEATS=true
          python3 scripts/run_odin_tests.py --root-only -define:NO_AUDIO=true
          python3 scripts/run_odin_tests.py --root-only -define:SPRITES=true -define:NO_SPRITES=true
          python3 scripts/run_odin_tests.py --root-only -define:SKIP_TITLE=true
          python3 scripts/run_odin_tests.py --root-only -define:FIXED_SEED=12345
          odin check src/ -vet -strict-style -collection:libs=vendor/ -define:CHEATS=true -define:NO_AUDIO=true -define:SPRITES=true -define:NO_SPRITES=true -define:SKIP_TITLE=true -define:FIXED_SEED=12345

      - name: Type check
        run: odin check src/ -vet -strict-style -collection:libs=vendor/

      - name: Build
        run: odin build src/ -out:into_the_depths -collection:libs=vendor/ -define:PUBLIC_BUILD=true

  build-web:
    name: Web (WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: nightly

      - uses: actions/checkout@v6

      - name: Install wasm-ld
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Checkout karl2d
        uses: actions/checkout@v6
        with:
          repository: karl-zylinski/karl2d
          path: karl2d

      - name: Build vendor stb libs
        run: make -C "$(odin root)/vendor/stb/src"

      - name: Build WASM
        run: bash scripts/build_karl2d_web.sh
