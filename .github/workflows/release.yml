name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: nightly

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y lld libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev

      - uses: actions/checkout@v6

      - name: Build
        run: |
          mkdir -p build/linux
          odin build src/ -out:build/linux/into_the_depths -o:speed -disable-assert -no-bounds-check

      - name: Package
        run: |
          cp -r assets build/linux/
          cd build/linux && tar czf ../../into_the_depths-linux-x86_64.tar.gz into_the_depths assets/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: into_the_depths-linux-x86_64.tar.gz

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: nightly

      - name: Install lld
        run: brew install lld

      - uses: actions/checkout@v6

      - name: Build
        run: |
          mkdir -p build/macos
          odin build src/ -out:build/macos/into_the_depths -o:speed -disable-assert -no-bounds-check

      - name: Bundle .app
        run: bash scripts/bundle_macos.sh build/macos/into_the_depths

      - name: Package
        run: |
          cd build/macos && tar czf ../../into_the_depths-macos-arm64.tar.gz "Into the Depths.app"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: into_the_depths-macos-arm64.tar.gz

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: nightly

      - uses: actions/checkout@v6
      - name: Install wasm-ld
        run: sudo apt-get update && sudo apt-get install -y lld


      - name: Checkout karl2d
        uses: actions/checkout@v6
        with:
          repository: karl-zylinski/karl2d
          path: karl2d

      - name: Build vendor stb libs
        run: make -C "$(odin root)/vendor/stb/src"

      - name: Build WASM
        run: bash scripts/build_karl2d_web.sh

      - name: Package
        run: cd build/web && zip -r ../../into_the_depths-web.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: into_the_depths-web.zip

  release:
    needs: [build-linux, build-macos-arm64]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            into_the_depths-linux-x86_64.tar.gz
            into_the_depths-macos-arm64.tar.gz
            into_the_depths-web.zip
