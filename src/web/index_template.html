<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Into the Depths</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        background: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      .loading {
        color: #888;
        font-family: monospace;
        font-size: 16px;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    <div class="loading" id="loading">Loading Into the Depths...</div>
    <canvas
      id="canvas"
      oncontextmenu="event.preventDefault()"
      tabindex="-1"
    ></canvas>
    <script>
      var Module = {
        canvas: document.getElementById("canvas"),
        onRuntimeInitialized: function () {
          document.getElementById("loading").style.display = "none";
        },
        print: function (text) {
          console.log(text);
        },
        printErr: function (text) {
          console.warn(text);
        },
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
